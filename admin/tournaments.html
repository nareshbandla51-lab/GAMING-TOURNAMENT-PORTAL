<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Tournaments | GameZone</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body data-page="admin-tournaments"><header class="dashboard-nav admin-nav"><a class="brand" href="dashboard.html"><span class="brand-mark">GZ</span><span><strong>GAMEZONE</strong><small>Admin Control</small></span></a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="tournaments.html">Tournaments</a><a href="users.html">Users</a></nav><button id="logoutBtn" class="btn btn-ghost">Logout</button></header>
<main class="dashboard-main"><section class="page-title row-title"><div><span class="eyebrow">ADMINISTRATOR</span><h1>Tournament <span>Manager</span></h1><p>Create, update and remove competition entries.</p></div><button class="btn btn-primary" id="openCreateBtn">+ Create Tournament</button></section><section id="adminTournamentTable" class="admin-table-wrap"></section><div class="modal" id="tournamentModal"><div class="modal-card"><button class="modal-close" id="closeModal">×</button><span class="eyebrow">TOURNAMENT FORM</span><h2 id="modalTitle">Create Tournament</h2><form id="tournamentForm" class="admin-form"><input type="hidden" id="editId"><label>Tournament Name<input id="tName" required placeholder="e.g. Valorant Night Cup"></label><div class="form-grid"><label>Game<select id="tGame" required><option>Call of Duty</option><option>Free Fire</option><option>Valorant</option><option>Fortnite</option></select></label><label>Type<select id="tType"><option>Free</option><option>Paid</option></select></label><label>Date<input id="tDate" type="date" required></label><label>Time<input id="tTime" type="time" required></label><label>Prize Pool<input id="tPrize" required placeholder="₹10,000"></label><label>Slots<input id="tSlots" type="number" min="2" required placeholder="100"></label></div><label>Description<textarea id="tDescription" rows="4" placeholder="Tell players what to expect..."></textarea></label><button class="btn btn-primary btn-full" type="submit">Save Tournament</button><p class="form-message" id="adminTournamentMessage"></p></form></div></div></main>
<script src="../js/auth.js"></script><script src="../js/tournaments.js"></script><script src="../js/admin.js"></script></body></html>
